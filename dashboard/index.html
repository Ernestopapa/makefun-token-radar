<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token Radar: pre-token protocols ranked by implied value</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="board-table">
    <header>
      <h1>TOKEN RADAR</h1>
      <p>Pre-token protocols ranked by implied value — which launch is worth farming next, and what to do about it.</p>
      <div id="snapshot-line"></div>
    </header>
    <div id="stats-strip"></div>
    <div id="model-bar"></div>
    <div id="model-sandbox"></div>
    <div id="controls"></div>
    <table id="board-table">
      <thead>
        <tr><th>Rank</th><th>Name</th><th>TVL</th><th>Implied Value</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="detail-drawer"></div>
    <div id="already-launched"></div>
    <div id="excluded"></div>
    <footer></footer>
  </main>
  <script src="../data.js"></script>
  <script src="app.js"></script>
</body>
</html>
